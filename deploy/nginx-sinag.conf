# nginx site for the Sinag / Gem Power marketing site.
#
#   sudo cp deploy/nginx-sinag.conf /etc/nginx/sites-available/sinag
#   sudo ln -sf /etc/nginx/sites-available/sinag /etc/nginx/sites-enabled/sinag
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Next runs on 127.0.0.1:3000 under pm2; nginx is what listens on 80/443.

server {
    listen 80;
    listen [::]:80;

    # Replace with the real hostname once DNS points here. `_` is a catch-all,
    # so the site answers on the server IP in the meantime.
    server_name _;

    # Hero videos are the largest asset; keep the proxy out of their way.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Videos and images are already compressed — gzipping them wastes CPU.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # REQUIRED. The inquiry rate limit keys on this header. Without it every
        # visitor looks like one IP, and a single submission locks out everyone
        # for five minutes.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }

    # The inbox holds contact details. Nothing should cache or index it.
    location /inquiries-inbox {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# For HTTPS, do not hand-write a TLS block — let certbot rewrite this file:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# It adds the 443 server block, the certificate paths, and the 80 -> 443
# redirect, and installs a renewal timer.
