# nginx site for the Sinag / Gem Power marketing site.
#
#   sudo cp deploy/nginx-sinag.conf /etc/nginx/sites-available/sinag
#   sudo ln -sf /etc/nginx/sites-available/sinag /etc/nginx/sites-enabled/sinag
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Next runs on 127.0.0.1:3000 under pm2; nginx is what listens on 80/443.
# Paths below assume the checkout is at /home/gem-web/sinag-website-demo.

server {
    listen 80;
    listen [::]:80;

    # Replace with the real hostname once DNS points here. `_` is a catch-all,
    # so the site answers on the server IP in the meantime.
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    # Next sets `compress: false`, so compression happens here. nginx does it
    # faster than Node and, more to the point, does not tie up the single Next
    # process while doing it. text/html is always included implicitly.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
    # Video and raster images are already compressed — gzipping them burns CPU
    # for nothing.

    # The hero videos are ~19MB together and Next serves everything under
    # public/ with `max-age=0`, so every page load revalidates all three. Serve
    # them straight off disk with a real cache instead; that traffic never
    # reaches Node. try_files falls back to Next for anything not on disk.
    location ~* \.(mp4|webm|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        root /home/gem-web/sinag-website-demo/public;
        try_files $uri @next;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # REQUIRED. The inquiry rate limit keys on this header. Without it every
        # visitor looks like one IP, and a single submission locks out everyone
        # for five minutes.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Buffering stays ON (the default). With it off, nginx streams straight
        # from Next and holds that connection for as long as a slow client takes
        # to read — and there is only one Next process.
        proxy_read_timeout 60s;
    }

    location @next {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The inbox holds contact details. Nothing should cache or index it.
    location /inquiries-inbox {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# For HTTPS, do not hand-write a TLS block — let certbot rewrite this file:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# It adds the 443 server block, the certificate paths, and the 80 -> 443
# redirect, and installs a renewal timer.
